<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#5B4FCF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1E1F23" media="(prefers-color-scheme: dark)">
    <title>Tiada sambungan internet · Club Portal</title>
    <link rel="icon" href="/icons/icon-192.png">
    <style>
        :root { --bg: #F6F5FB; --card: #FFFFFF; --fg: #1E1B3A; --muted: #5F5C7A; --primary: #5B4FCF; --on-primary: #FFFFFF; --ring: #DEDCEC; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #1E1F23; --card: #26272C; --fg: #F1F1F4; --muted: #B3B4BE; --primary: #9B8CFA; --on-primary: #14112E; --ring: #3A3B42; }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
        main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--ring); border-radius: 24px; padding: 28px 20px; text-align: center; }
        img { width: 64px; height: 64px; border-radius: 16px; }
        h1 { font-size: 1.5rem; margin: 16px 0 8px; }
        p { font-size: 1rem; line-height: 1.5; margin: 0 0 8px; }
        .en { color: var(--muted); }
        a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 16px; padding: 0 24px;
            border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 1.05rem; text-decoration: none; }
        a:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    </style>
</head>
<body>
<main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Tiada sambungan internet</h1>
    <p>Semak sambungan anda dan cuba lagi. Maklumat bayaran hanya dipaparkan apabila anda dalam talian.</p>
    <p class="en" lang="en">No internet connection. Check your connection and try again. Payment details are only shown when you are online.</p>
    <a href="">Cuba lagi / Try again</a>
</main>
</body>
</html>
